name: 58.com
description: '58.com (58同城, "58 Tongcheng") is China''s largest online classifieds and local-services
  marketplace, often called the "Chinese Craigslist." Founded in 2005 and headquartered in Beijing,
  it operates listings across recruitment and jobs, real estate and housing (Anjuke), used goods
  (Zhuanzhuan), automobiles, local services, and yellow-pages business directories. Formerly listed
  on the NYSE (WUBA), it was taken private in 2020 by a Warburg Pincus / General Atlantic consortium.
  Its 58 Open Platform (open.58.com) exposes payment, recruitment/jobs data, housing, local-service
  information, security risk-control, marketing, and social capabilities to approved third-party
  partners via reviewed developer accounts and API keys. Backed historically by DCM Ventures.'
